name: Docker Beta Backfill

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Temporary recovery selector; use both for beta.1 and beta.2
        required: false
        default: both
        type: choice
        options:
          - stable
          - extended-stable
          - both
      dry_run:
        description: Resolve and summarize without publishing
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.plan.outputs.dry_run }}
      image_tag_suffix: ${{ steps.plan.outputs.image_tag_suffix }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require the dedicated recovery branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/pe/docker-beta-backfill-2026-8-1" ]]; then
            echo "::error::Docker beta backfill must run from the dedicated recovery branch; got ${WORKFLOW_REF}."
            exit 1
          fi

      - name: Checkout trusted refresh tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve refresh plan
        id: plan
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'schedule' && 'both' || inputs.channel }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" != "both" ]]; then
            echo "::error::This temporary recovery workflow publishes beta.1 and beta.2 together; select both."
            exit 1
          fi

          beta1_tag="v2026.8.1-beta.1"
          beta1_sha="ff8a3fe9d03eff4a70f5464714c3a389b06bfec8"
          beta2_tag="v2026.8.1-beta.2"
          beta2_sha="8f382a202ff1e15833394b481615dcdda99b04d7"
          for target in "${beta1_tag}:${beta1_sha}" "${beta2_tag}:${beta2_sha}"; do
            tag="${target%%:*}"
            expected_sha="${target#*:}"
            actual_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "${actual_sha}" != "${expected_sha}" ]]; then
              echo "::error::${tag} resolved to ${actual_sha}; expected ${expected_sha}."
              exit 1
            fi
          done

          beta1_entry="$(
            jq -cn \
              --arg channel beta.1 \
              --arg tag "${beta1_tag}" \
              --arg release_sha "${beta1_sha}" \
              '{channel: $channel, tag: $tag, release_sha: $release_sha}'
          )"
          beta2_entry="$(
            jq -cn \
              --arg channel beta.2 \
              --arg tag "${beta2_tag}" \
              --arg release_sha "${beta2_sha}" \
              '{channel: $channel, tag: $tag, release_sha: $release_sha}'
          )"
          matrix="$(
            jq -cn \
              --argjson beta1 "${beta1_entry}" \
              --argjson beta2 "${beta2_entry}" \
              '[$beta1, $beta2]'
          )"

          {
            echo "dry_run=${DRY_RUN}"
            echo "image_tag_suffix="
            echo "matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Docker beta backfill plan"
            echo "- beta.1: ${beta1_tag} (${beta1_sha})"
            echo "- beta.2: ${beta2_tag} (${beta2_sha})"
            echo "- Image tag suffix: none"
            echo "- Dry run: ${DRY_RUN}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Refresh ${{ matrix.channel }} Docker images
    needs: plan
    if: needs.plan.outputs.dry_run != 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ matrix.tag }}
      release_sha: ${{ matrix.release_sha }}
      image_tag_suffix: ${{ needs.plan.outputs.image_tag_suffix }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
