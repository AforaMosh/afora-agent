parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/AforaKit/Sources/AforaChatUI
  - ../shared/AforaKit/Sources/AforaKit
  - ../shared/AforaKit/Sources/AforaNativeState
  - ../shared/AforaKit/Sources/AforaProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/AforaKit/Sources/AforaProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  afora_design_colors:
    name: "Afora design colors"
    excluded:
      - Sources/Design/AforaBrand.swift
      - ../shared/AforaKit/Sources/AforaChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use AforaBrand or AforaChatTheme design tokens instead of raw accent/status colors."
    severity: error
