name: Afora
options:
  bundleIdPrefix: ai.aforafoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  AforaKit:
    path: ../shared/AforaKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  Afora:
    shared: true
    build:
      targets:
        Afora: all
    test:
      targets:
        - AforaTests
        - AforaLogicTests
  AforaLogicTests:
    shared: true
    build:
      targets:
        AforaLogicTests: all
    test:
      targets:
        - AforaLogicTests
  AforaUITests:
    shared: true
    build:
      targets:
        AforaUITests: all
    test:
      targets:
        - AforaUITests
  AforaWatchApp:
    shared: true
    build:
      targets:
        AforaWatchApp: all

targets:
  Afora:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: AforaShareExtension
        embed: true
      - target: AforaActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: AforaWatchApp
      - package: AforaKit
      - package: AforaKit
        product: AforaChatUI
      - package: AforaKit
        product: AforaProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/AforaKit/Sources/AforaChatUI,$SRCROOT/../shared/AforaKit/Sources/AforaKit,$SRCROOT/../shared/AforaKit/Sources/AforaNativeState,$SRCROOT/../shared/AforaKit/Sources/AforaProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    postBuildScripts:
      - name: Stage Canvas A2UI resources
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          repo_root="$(cd "$SRCROOT/../.." && pwd -P)"
          resource_product="$BUILT_PRODUCTS_DIR/AforaKit_AforaKit.bundle"
          resource_bundle="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AforaKit_AforaKit.bundle"
          test -d "$resource_product"
          test -d "$resource_bundle"
          node --import tsx "$repo_root/scripts/sync-native-a2ui.mts" \
            --write \
            --output "$resource_product/CanvasA2UI"
          rm -rf "$resource_bundle/CanvasA2UI"
          cp -R "$resource_product/CanvasA2UI" "$resource_bundle/CanvasA2UI"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(AFORA_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        AFORA_ACTIVE_APP_GROUP_ID: "$(AFORA_APP_GROUP_ID)"
        AFORA_URL_SCHEME: afora
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AFORA_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          AFORA_ACTIVE_APP_GROUP_ID: "$(AFORA_DEBUG_APP_GROUP_ID)"
          AFORA_CODE_SIGN_ENTITLEMENTS: Sources/Afora.entitlements
          AFORA_APNS_ENTITLEMENT_ENVIRONMENT: development
          AFORA_URL_SCHEME: afora-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          AFORA_PUSH_MODE: localSandbox
          AFORA_PUSH_RELAY_BASE_URL: ""
        Release:
          AFORA_CODE_SIGN_ENTITLEMENTS: Sources/Afora.entitlements
          AFORA_APNS_ENTITLEMENT_ENVIRONMENT: production
          AFORA_PUSH_MODE: localProduction
          AFORA_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Afora
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.aforafoundation.app
            CFBundleURLSchemes:
              - "$(AFORA_URL_SCHEME)"
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        AforaCanonicalVersion: "$(AFORA_IOS_VERSION)"
        AforaGitCommit: "$(AFORA_GIT_COMMIT)"
        AforaBuildTimestamp: "$(AFORA_BUILD_TIMESTAMP)"
        AforaAppGroupIdentifier: "$(AFORA_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: Afora discovers and connects to your Afora gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _afora-gw._tcp
        NSCameraUsageDescription: Afora uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: Afora uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Afora uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Afora uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Afora uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Afora uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Afora can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Afora uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: Afora may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: Afora reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: Afora does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: Afora lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Afora uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Afora uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        AforaPushMode: "$(AFORA_PUSH_MODE)"
        AforaPushRelayBaseURL: "$(AFORA_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AforaShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: AforaKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/AforaShareExtension.entitlements
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        AFORA_ACTIVE_APP_GROUP_ID: "$(AFORA_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AFORA_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          AFORA_ACTIVE_APP_GROUP_ID: "$(AFORA_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Afora Share
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        AforaAppGroupIdentifier: "$(AFORA_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  AforaActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/AforaActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/AforaKit/Sources/AforaChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AFORA_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Afora Activity
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AforaWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/AforaKit/Sources/AforaChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotView.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotAnimator.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: AforaKit
        product: AforaKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(AFORA_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(AFORA_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        AFORA_COMPANION_APP_BUNDLE_ID: "$(AFORA_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AFORA_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          AFORA_COMPANION_APP_BUNDLE_ID: "$(AFORA_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Afora
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(AFORA_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: Afora connects this Apple Watch directly to your Gateway on trusted local networks.
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  AforaTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: Afora
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Afora.app/Afora"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"

  AforaLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareContentExtractor.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotView.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotAnimator.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/AforaMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/AforaKit/Sources/AforaChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: AforaKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"

  AforaUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Afora
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(AFORA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(AFORA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(AFORA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Afora
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(AFORA_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: AforaUITests
        CFBundleShortVersionString: "$(AFORA_MARKETING_VERSION)"
        CFBundleVersion: "$(AFORA_BUILD_VERSION)"
