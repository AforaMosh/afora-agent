services:
  - type: web
    name: afora
    runtime: docker
    plan: starter
    # The image CMD has no --allow-unconfigured, so a fresh disk with no
    # afora.json exits before binding. Render has no shell before the first
    # boot, so the flag has to come from the blueprint.
    dockerCommand: node afora.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: AFORA_GATEWAY_PORT
        value: "8080"
      - key: AFORA_STATE_DIR
        value: /data/.afora
      - key: AFORA_WORKSPACE_DIR
        value: /data/workspace
      - key: AFORA_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: afora-data
      mountPath: /data
      sizeGB: 1
